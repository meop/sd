name: Fork ARM target smoke

on:
  push:
    branches: [windows-arm64-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir package
          if [[ "${{ matrix.archive }}" == zip ]]; then
            cp target/${{ matrix.target }}/release/sd.exe package/
            7z a sd-${{ matrix.target }}.zip package
          else
            cp target/${{ matrix.target }}/release/sd package/
            tar czf sd-${{ matrix.target }}.tar.gz package
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: sd-${{ matrix.target }}
          path: sd-*
